name: Vérifier

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Exécuter les tests
        run: node --test tests/*.test.js

  donnees:
    name: Cohérence des horaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Contrôler data/horaires.json
        run: python3 tools/verifier_donnees.py

      - name: Vérifier que la coquille hors ligne liste tous les modules
        run: python3 tools/verifier_service_worker.py

      - name: Vérifier la table de référence GTFS
        run: python3 tools/verifier_gtfs.py

  statique:
    name: Analyse statique JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Installer les outils de développement
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier (formatage homogène)
        run: npm run format:check

      - name: TypeScript en mode checkJs (annotations JSDoc)
        run: npm run typecheck

  python:
    name: Analyse statique Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Installer Ruff
        run: pip install ruff

      - name: Ruff sur les outils
        run: ruff check tools/
