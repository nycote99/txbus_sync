name: Veille sur les horaires

# Les données sont figées au moment de l'extraction, et rien n'avertit quand la
# STC publie une nouvelle fiche : l'application continuerait à servir des heures
# périmées, avec assurance. Ce contrôle hebdomadaire relit les pages horaires du
# site et ouvre une issue dès qu'elles pointent autre chose.

on:
  schedule:
    # Lundi 11 h UTC, soit 7 h à Sorel-Tracy : les changements d'horaire de la
    # STC prennent effet un lundi.
    - cron: '0 11 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  veille:
    name: Comparer aux sources publiées
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Relever les sources publiées
        id: veille
        run: |
          if python3 tools/veiller_sources.py > rapport.txt 2>&1; then
            echo "ecart=non" >> "$GITHUB_OUTPUT"
          else
            echo "ecart=oui" >> "$GITHUB_OUTPUT"
          fi
          cat rapport.txt

      - name: Ouvrir ou mettre à jour l'issue de suivi
        if: steps.veille.outputs.ecart == 'oui'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const rapport = fs.readFileSync('rapport.txt', 'utf8');
            const titre = 'Les horaires publiés par la STC ont changé';
            const corps = [
              'La veille hebdomadaire a relevé un écart entre les horaires',
              'publiés par la STC et ceux embarqués dans l’application.',
              '',
              '```',
              rapport.trim(),
              '```',
              '',
              'Tant que ce n’est pas repris, l’application sert des heures',
              'périmées sans le dire — y compris les heures limites de',
              'réservation du taxibus, qui en dépendent.',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');

            // Une seule issue ouverte à la fois : on met à jour la sienne
            // plutôt que d'en accumuler une par semaine.
            const ouvertes = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'veille-horaires',
            });

            if (ouvertes.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: ouvertes.data[0].number,
                body: corps,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: titre,
                body: corps,
                labels: ['veille-horaires'],
              });
            }
